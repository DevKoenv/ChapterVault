name: Build

on:
  push:
    branches: [ master, refactor ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # CI builds with JDK 21, the Docker image runs on 21. The build also compiles with -Xjdk-release=21, so code that
      # builds on a newer local JDK cannot use APIs that JDK 21 lacks.
      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # `build` runs the tests, ktlint, detekt, the module graph check (verifyModuleGraph) and the coverage gate
      - name: Build, test and verify
        run: ./gradlew build koverXmlReport

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: build/reports/kover/report.xml

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build the image
        run: docker build --build-arg REVISION="$(git rev-parse --short HEAD)" -t chaptervault:ci .

      - name: Run the container and check it
        run: |
          docker run -d --name cv -p 8080:8080 -e CHAPTERVAULT_ADMIN_PASS=ci-smoke-test-password chaptervault:ci

          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' cv)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          echo "health: $status"
          docker logs cv
          [ "$status" = "healthy" ] || { echo "::error::container did not become healthy"; exit 1; }

          # not root
          [ "$(docker exec cv id -u)" != "0" ] || { echo "::error::container runs as root"; exit 1; }

          # the API answers and the bootstrap admin can log in
          curl -sf http://127.0.0.1:8080/health
          curl -sf -X POST http://127.0.0.1:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-smoke-test-password"}'

          # SIGTERM must stop it gracefully: 143 is "terminated by SIGTERM"; 137 would mean docker had to kill it
          docker stop -t 30 cv
          code=$(docker inspect -f '{{.State.ExitCode}}' cv)
          echo "exit code: $code"
          [ "$code" != "137" ] || { echo "::error::the server ignored SIGTERM"; exit 1; }
