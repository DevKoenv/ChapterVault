name: Build

on:
  push:
    branches: [ master, refactor ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build and test
        run: ./gradlew build

      - name: Check extension isolation
        run: |
          result=$(./gradlew :extensions:dependencies --configuration runtimeClasspath 2>/dev/null | grep infrastructure || true)
          if [ -n "$result" ]; then
            echo "FAIL: :extensions depends on :infrastructure"
            echo "$result"
            exit 1
          fi
          echo "OK: extension isolation intact"
