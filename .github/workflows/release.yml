name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Run tests
        run: ./gradlew test

      - name: Build distribution
        run: ./gradlew :app:distZip :app:distTar

      - name: Get version from build.gradle.kts
        id: gradle_version
        run: |
          VERSION=$(sed -nE 's/^version *= *"([^"]+)"/\1/p' build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get version from tag
        id: tag_version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate version
        run: |
          if [ "${{ steps.tag_version.outputs.version }}" != "${{ steps.gradle_version.outputs.version }}" ]; then
            echo "[ERROR] Tag version (${{ steps.tag_version.outputs.version }}) does not match Gradle version (${{ steps.gradle_version.outputs.version }})"
            exit 1
          fi
          echo "[INFO] Tag matches Gradle version"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ChapterVault v${{ steps.gradle_version.outputs.version }}
          tag_name: v${{ steps.gradle_version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.gradle_version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            modules/app/build/distributions/*.zip
            modules/app/build/distributions/*.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
