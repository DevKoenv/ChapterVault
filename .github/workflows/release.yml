name: Release

# A tag publishes a jar and a container image, so it is gated: the tagged commit must be on master and must build
# and pass every test first. A tag with a suffix (v1.0.0-rc1) is published as a pre-release and never moves `latest`.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: The tag must be on master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master \
            || { echo "::error::$GITHUB_REF_NAME is not on master; tag a commit that has been merged"; exit 1; }

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build and test
        run: ./gradlew build --no-daemon

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Work out the version and image tags
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/devkoenv/chaptervault"
          TAGS="$IMAGE:$VERSION"
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          else
            TAGS="$TAGS"$'\n'"$IMAGE:latest"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_OUTPUT"
          { echo 'TAGS<<EOF'; echo "$TAGS"; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - name: Build shadow JAR
        run: ./gradlew :apps:server:shadowJar --no-daemon -q -PreleaseVersion=${{ steps.version.outputs.VERSION }}

      - name: Create GitHub Release
        run: |
          flags=""
          if [ "${{ steps.version.outputs.PRERELEASE }}" = "true" ]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" \
            apps/server/build/libs/server-*.jar \
            --title "ChapterVault $GITHUB_REF_NAME" \
            --generate-notes $flags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: ${{ steps.version.outputs.TAGS }}
