name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build distribution
        run: ./gradlew :app:distZip :app:distTar --no-daemon

      - name: Get version from Gradle
        id: gradle_version
        run: |
          VERSION=$(./gradlew -q printVersion)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Get version from tag
        id: tag_version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV

      - name: Validate version
        run: |
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "[ERROR] Tag version ($TAG_VERSION) does not match Gradle version ($VERSION)"
            exit 1
          fi
          echo "[INFO] Tag matches Gradle version"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ChapterVault v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          generate_release_notes: true
          files: |
            modules/app/build/distributions/*.zip
            modules/app/build/distributions/*.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
