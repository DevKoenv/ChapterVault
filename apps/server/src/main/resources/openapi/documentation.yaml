openapi: "3.0.3"
info:
  title: ChapterVault API
  version: "1.0.0"
  description: |
    Self-hosted manga/comic library server with connector-based download pipeline.

    **Paths.** The REST API lives under `/api/v1` (the server URL below). `/health`, the OPDS feeds
    (`/opds/v1/...`) and `/swagger` are served from the root and say so on their path items.

    **Authentication.** REST calls use `Authorization: Bearer <token>` from `POST /auth/login`. OPDS uses HTTP Basic
    auth with the same account. Basic auth sends the password with every request, so put the server behind TLS.
    Tokens are revoked when the password changes, the account is deleted, or its role changes.

    **Permissions.** Routes check permissions, never role names. A role is a bundle of them:

    | Permission | ADMIN | USER | GUEST | Covers |
    | --- | --- | --- | --- | --- |
    | `READ_LIBRARY` | yes | yes | yes | browse, read pages, own progress and export, OPDS |
    | `WRITE_PROGRESS` | yes | yes | no | own reading progress, reading status, backup import |
    | `WRITE_LIBRARY` | yes | no | no | add/edit/remove series and chapters, browse sources |
    | `TRIGGER_TASKS` | yes | no | no | queue downloads and refreshes, cancel tasks |
    | `VIEW_TASKS` | yes | no | no | task list, task errors, task events in `/events` |
    | `MANAGE_USERS` | yes | no | no | users and roles |
    | `MANAGE_EXTENSIONS` | yes | no | no | extensions |
    | `MANAGE_NOTIFICATIONS` | yes | no | no | notification targets |
    | `MANAGE_SERVER` | yes | no | no | `/system/updates`, `/system/storage` |

    **Errors.** Every error, including 401, 404 and 405 produced by the server itself, is
    `{"error": "<CODE>", "message": "<text>"}`. A missing or invalid token is 401; a valid token without the needed
    permission is 403. `429` carries `Retry-After`.

servers:
  - url: http://localhost:8080/api/v1
    description: Local server

tags:
  - name: auth
    description: Authentication
  - name: library
    description: Library — series and chapters
  - name: reading-status
    description: Per-user reading status for series
  - name: tasks
    description: Background task queue
  - name: connectors
    description: External source connectors (WRITE_LIBRARY)
  - name: notifications
    description: Push notification targets and dispatch (MANAGE_NOTIFICATIONS)
  - name: system
    description: System utilities
  - name: users
    description: User account management (MANAGE_USERS)
  - name: opds
    description: OPDS v1 feed (Basic Auth) with Page Streaming Extension (PSE)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    basicAuth:
      type: http
      scheme: basic

  # shared by GET /library/series and GET /library/series/search; filters combine with AND
  parameters:
    SeriesSort:
      in: query
      name: sort
      schema: { type: string, enum: [title, added], default: title }
      description: "`title` ignores case (ASCII letters); `added` is when the series was added to the library. Case-insensitive; any other value is rejected with 400"
    SeriesOrder:
      in: query
      name: order
      schema: { type: string, enum: [asc, desc] }
      description: Default `asc` for `title`, `desc` (newest first) for `added`. Ties are broken by id, so pages are stable
    SeriesReadingStatus:
      in: query
      name: readingStatus
      schema: { type: string, enum: [PLAN_TO_READ, READING, COMPLETED, DROPPED, ON_HOLD] }
      description: Only series the current user gave this reading status. Case-insensitive; any other value is rejected with 400
    SeriesGenre:
      in: query
      name: genre
      schema: { type: string }
      description: Only series with this genre (exact match)
    SeriesLanguage:
      in: query
      name: language
      schema: { type: string }
      description: Only series in this language, e.g. `en`
    SeriesUpstreamStatus:
      in: query
      name: upstreamStatus
      schema: { type: string, enum: [ONGOING, COMPLETED, HIATUS, CANCELLED] }
      description: Only series with this status at the source. Case-insensitive; any other value is rejected with 400

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: admin }
        password: { type: string, example: secret }

    LoginResponse:
      type: object
      properties:
        token:    { type: string }
        username: { type: string }
        roles:    { type: array, items: { type: string }, example: [ADMIN] }

    UserDto:
      type: object
      properties:
        id:        { type: string, format: uuid }
        username:  { type: string }
        roles:     { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }

    SeriesDto:
      type: object
      properties:
        id:            { type: string, format: uuid }
        title:         { type: string }
        connectorId:   { type: string, nullable: true }
        externalId:    { type: string, nullable: true }
        language:      { type: string, example: en, description: "BCP 47 language tag; defaults to 'en'" }
        status:        { type: string, enum: [IN_LIBRARY] }
        autoDownload:  { type: boolean }
        coverUrl:      { type: string, nullable: true }
        description:   { type: string, nullable: true }
        author:        { type: string, nullable: true }
        artist:        { type: string, nullable: true }
        year:          { type: integer, nullable: true }
        upstreamStatus: { type: string, nullable: true, description: "Publication status at the source, e.g. ONGOING or COMPLETED" }
        genres:        { type: array, items: { type: string } }
        readingStatus: { type: string, nullable: true, enum: [PLAN_TO_READ, READING, COMPLETED, DROPPED, ON_HOLD], description: "Current user's reading status; null if not set" }
        addedAt:       { type: string, format: date-time }
        updatedAt:     { type: string, format: date-time }

    ChapterDto:
      type: object
      properties:
        id:             { type: string, format: uuid }
        seriesId:       { type: string, format: uuid }
        title:          { type: string }
        chapterIndex:   { type: number, format: double }
        downloadStatus: { type: string, enum: [AVAILABLE, PENDING, DOWNLOADING, DOWNLOADED, FAILED] }
        format:         { type: string, nullable: true, enum: [CBZ, FOLDER] }
        pageCount:      { type: integer, nullable: true }
        addedAt:        { type: string, format: date-time }
        updatedAt:      { type: string, format: date-time }

    TaskDto:
      type: object
      properties:
        id:           { type: string, format: uuid }
        type:         { type: string, enum: [FETCH_SERIES_METADATA, FETCH_CHAPTERS, DOWNLOAD_CHAPTER] }
        status:       { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED, CANCELLED] }
        targetType:   { type: string, enum: [SERIES, CHAPTER] }
        targetId:     { type: string, format: uuid }
        createdAt:    { type: string, format: date-time }
        updatedAt:    { type: string, format: date-time }
        payload:      { type: object, additionalProperties: { type: string } }
        errorMessage: { type: string, nullable: true }
        retryCount:   { type: integer, default: 0, description: "Number of times this task has been retried after failure" }

    TaskStateChangedEvent:
      type: object
      description: Emitted when a task transitions to a new state
      properties:
        taskId:       { type: string, format: uuid }
        taskType:     { type: string, enum: [FETCH_SERIES_METADATA, FETCH_CHAPTERS, DOWNLOAD_CHAPTER] }
        targetId:     { type: string, format: uuid }
        status:       { type: string, enum: [QUEUED, RUNNING, COMPLETED, FAILED, CANCELLED] }
        errorMessage: { type: string, nullable: true, description: "Only present when status is FAILED" }
        occurredAt:   { type: string, format: date-time }

    ChapterDownloadStatusEvent:
      type: object
      description: Emitted when a chapter's download status changes
      properties:
        chapterId:  { type: string, format: uuid }
        seriesId:   { type: string, format: uuid }
        status:     { type: string, enum: [AVAILABLE, PENDING, DOWNLOADING, DOWNLOADED, FAILED] }
        occurredAt: { type: string, format: date-time }

    ConnectorDto:
      type: object
      properties:
        id:   { type: string }
        name: { type: string }

    SeriesSearchResultDto:
      type: object
      properties:
        externalId:  { type: string }
        title:       { type: string }
        coverUrl:    { type: string, nullable: true }
        description: { type: string, nullable: true }
        inLibrary:   { type: boolean, description: "True if this series (by externalId) already exists in the library" }

    SeriesMetadataDto:
      type: object
      properties:
        externalId:  { type: string }
        title:       { type: string }
        coverUrl:    { type: string, nullable: true }
        description: { type: string, nullable: true }
        inLibrary:   { type: boolean, description: "True if this series (by externalId) already exists in the library" }

    ChapterMetadataDto:
      type: object
      properties:
        externalId:   { type: string }
        title:        { type: string }
        chapterIndex: { type: number, format: double }
        pageCount:    { type: integer, nullable: true }

    ProgressDto:
      type: object
      properties:
        seriesId:        { type: string, format: uuid }
        latestChapterId: { type: string, format: uuid, nullable: true, description: Most recently read chapter }
        latestPage:      { type: integer, description: "Reserved: always 0 for now. Backups carry it, so a later version can record the page reached in that chapter" }
        unreadCount:     { type: integer, description: Chapters not yet marked as read }
        totalCount:      { type: integer, description: Total number of chapters in the series }

    DownloadQueuedResponse:
      type: object
      properties:
        queued: { type: integer, description: Number of download tasks enqueued }

    AddSeriesRequest:
      type: object
      required: [connectorId, externalId]
      properties:
        connectorId:  { type: string, example: mock }
        externalId:   { type: string, example: series-1 }
        language:     { type: string, default: en, example: en, description: "BCP 47 language tag; must be supported by the connector" }
        autoDownload: { type: boolean, default: false }

    SetReadingStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [PLAN_TO_READ, READING, COMPLETED, DROPPED, ON_HOLD] }

    NotificationTargetResponse:
      type: object
      properties:
        id:        { type: string, format: uuid }
        name:      { type: string }
        type:      { type: string, enum: [NTFY, GOTIFY, DISCORD, WEBHOOK] }
        url:       { type: string }
        hasToken:  { type: boolean, description: "True when a token is stored. The token itself is never returned; send a new one with PATCH to change it." }
        enabled:   { type: boolean }
        createdAt: { type: string, format: date-time }

    CreateNotificationTargetRequest:
      type: object
      required: [name, type, url]
      properties:
        name:    { type: string, example: "My NTFY server" }
        type:    { type: string, enum: [NTFY, GOTIFY, DISCORD, WEBHOOK] }
        url:     { type: string, example: "https://ntfy.sh/mymangaupdates", description: "http or https. Targets on this machine (localhost, loopback, link-local) are refused unless notifications.allowLocalTargets is true; LAN addresses are allowed." }
        token:   { type: string, nullable: true, description: "Optional API token; required by Gotify; optional for NTFY/Webhook" }
        enabled: { type: boolean, default: true }

    PatchNotificationTargetRequest:
      type: object
      properties:
        name:    { type: string, nullable: true }
        url:     { type: string, nullable: true, description: "Same rules as on create" }
        token:   { type: string, nullable: true, description: "Omit to keep the stored token; an empty string removes it" }
        enabled: { type: boolean, nullable: true }

    UpdateSeriesRequest:
      type: object
      description: |
        Every field is optional; only the fields sent are changed. Metadata fields you set become "user edited" and
        are no longer overwritten when the series is refreshed from its source; list them in `clearFields` to hand
        them back to the source.
      properties:
        autoDownload:   { type: boolean, nullable: true }
        defaultFormat:  { type: string, nullable: true, enum: [CBZ, FOLDER] }
        title:          { type: string, nullable: true }
        coverUrl:       { type: string, nullable: true }
        description:    { type: string, nullable: true }
        author:         { type: string, nullable: true }
        artist:         { type: string, nullable: true }
        year:           { type: integer, nullable: true }
        upstreamStatus: { type: string, nullable: true }
        genres:         { type: array, nullable: true, items: { type: string } }
        clearFields:    { type: array, nullable: true, items: { type: string }, description: "Fields to release back to the source" }

    BackupProgress:
      type: object
      required: [connectorId, externalId, latestPage, readAt]
      properties:
        connectorId:               { type: string }
        externalId:                { type: string }
        language:                  { type: string, default: en, description: "Series language; part of the series identity" }
        latestChapterExternalId:   { type: string, nullable: true }
        latestPage:                { type: integer, minimum: 0 }
        readAt:                    { type: string, format: date-time }
    BackupReadingStatus:
      type: object
      required: [connectorId, externalId, status]
      properties:
        connectorId: { type: string }
        externalId:  { type: string }
        language:    { type: string, default: en, description: "Series language; part of the series identity" }
        status:      { type: string, enum: [PLAN_TO_READ, READING, COMPLETED, DROPPED, ON_HOLD] }
    ExtensionDto:
      type: object
      properties:
        id:           { type: string }
        name:         { type: string }
        version:      { type: string }
        status:       { type: string, enum: [DISCOVERED, LOADING, ENABLED, DISABLED, FAILED, UNLOADED] }
        source:       { type: string, enum: [BUNDLED, LOCAL], description: "LOCAL is a JAR in the data folder" }
        capabilities: { type: array, items: { type: string, enum: [connector, metadata_enricher, notification_channel] } }
        errorMessage: { type: string, nullable: true }

    PaginatedSeriesResponse:
      type: object
      properties:
        items:       { type: array, items: { $ref: "#/components/schemas/SeriesDto" } }
        page:        { type: integer }
        size:        { type: integer }
        totalItems:  { type: integer, format: int64 }
        totalPages:  { type: integer }
        hasNext:     { type: boolean }
        hasPrevious: { type: boolean }

    PaginatedChapterResponse:
      type: object
      properties:
        items:       { type: array, items: { $ref: "#/components/schemas/ChapterDto" } }
        page:        { type: integer }
        size:        { type: integer }
        totalItems:  { type: integer, format: int64 }
        totalPages:  { type: integer }
        hasNext:     { type: boolean }
        hasPrevious: { type: boolean }

    PaginatedTaskResponse:
      type: object
      properties:
        items:       { type: array, items: { $ref: "#/components/schemas/TaskDto" } }
        page:        { type: integer }
        size:        { type: integer }
        totalItems:  { type: integer, format: int64 }
        totalPages:  { type: integer }
        hasNext:     { type: boolean }
        hasPrevious: { type: boolean }

    PaginatedSearchResponse:
      type: object
      properties:
        items:       { type: array, items: { $ref: "#/components/schemas/SeriesSearchResultDto" } }
        page:        { type: integer }
        size:        { type: integer }
        totalItems:  { type: integer, format: int64 }
        totalPages:  { type: integer }
        hasNext:     { type: boolean }
        hasPrevious: { type: boolean }

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:   { type: string, example: NOT_FOUND, description: "Machine-readable error code" }
        message: { type: string, example: "Series 'abc' not found", description: "Human-readable description" }

security:
  - bearerAuth: []

paths:
  /health:
    servers:
      - url: http://localhost:8080
    get:
      tags: [system]
      summary: Health check
      description: Reports the database and the task executor. The executor stays "ok" while it is busy with long downloads.
      security: []
      responses:
        "200":
          description: All checks passing
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded], example: ok }
                  checks:
                    type: object
                    properties:
                      database: { type: string, enum: [ok, error] }
                      executor: { type: string, enum: [ok, error] }
        "503":
          description: One or more checks failing
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded], example: degraded }
                  checks:
                    type: object
                    properties:
                      database: { type: string, enum: [ok, error] }
                      executor: { type: string, enum: [ok, error] }

  /events:
    get:
      tags: [system]
      summary: Server-Sent Events stream for live updates
      description: |
        Streams real-time events as Server-Sent Events (SSE). Each event has an `event` type field and a JSON `data` payload.

        **Event types:**
        - `task.state_changed` — a background task changed state (queued/running/completed/failed/cancelled). Data: `TaskStateChangedEvent`.
        - `chapter.download_status` — a chapter's download status changed. Data: `ChapterDownloadStatusEvent`.

        Which events a client receives depends on its permissions: `task.state_changed` (which carries upstream error
        text) needs `VIEW_TASKS`, `chapter.download_status` needs `READ_LIBRARY`.

        The stream stays open until the client disconnects. A buffer of 64 events is maintained per connection; oldest events are dropped if the client falls behind.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Each SSE message has `event: <type>` and `data: <json>`.
                  See TaskStateChangedEvent and ChapterDownloadStatusEvent schemas.
        "401": { description: Not authenticated }

  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      description: |
        Creates a new USER account. Requires `auth.registrationEnabled: true` in `config.yaml`
        (or env var `CHAPTERVAULT_AUTH_REGISTRATION_ENABLED=true`); returns 403 otherwise.
        The first administrator is created automatically on an empty install regardless of this flag; its generated
        password is printed once in the server log.

        Usernames are trimmed, at most 100 characters, compared ignoring case, and may not contain control
        characters. Passwords must be 8 characters or more and at most 72 bytes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDto" }
        "400": { description: Invalid request body, username or password (the message says which rule) }
        "403": { description: Registration is disabled on this server (REGISTRATION_DISABLED) }
        "409": { description: Username already taken }
        "429":
          description: Too many registration attempts from this IP; rate limit exceeded
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until the rate limit window resets }

  /auth/login:
    post:
      tags: [auth]
      summary: Authenticate and obtain a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { description: Invalid credentials }
        "429":
          description: Too many login attempts from this IP; rate limit exceeded
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until the rate limit window resets }

  /auth/logout:
    delete:
      tags: [auth]
      summary: Invalidate the current bearer token
      responses:
        "204": { description: Session invalidated }
        "401": { description: Missing or invalid token }

  /auth/me:
    get:
      tags: [auth]
      summary: Return the currently authenticated user
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDto" }

  /auth/change-password:
    post:
      tags: [auth]
      summary: Change the authenticated user's password
      description: |
        All of the user's sessions are revoked, including the one used for this call: log in again afterwards.
        Basic-auth access (OPDS) with the old password stops at once as well.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8, description: "At least 8 characters and at most 72 bytes" }
      responses:
        "204": { description: Password changed; all sessions revoked }
        "400": { description: Invalid request body or newPassword breaks the password rules }
        "401": { description: Current password incorrect }

  /users:
    get:
      tags: [users]
      summary: List all user accounts (ADMIN)
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserDto" }
        "403": { description: Forbidden; the user lacks the required permission }

  /users/{id}:
    delete:
      tags: [users]
      summary: Delete a user account (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: User deleted }
        "400": { description: Cannot delete your own account }
        "403": { description: Forbidden; the user lacks the required permission }
        "404": { description: User not found }
        "409": { description: The user is the last administrator (CONFLICT) }

  /users/{id}/role:
    patch:
      tags: [users]
      summary: Change a user's role (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [ADMIN, USER, GUEST] }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDto" }
        "400": { description: Invalid role }
        "403": { description: Forbidden; the user lacks the required permission }
        "404": { description: User not found }
        "409": { description: The user is the last administrator and cannot be demoted }

  /library/series/search:
    get:
      tags: [library]
      summary: Search series in the library
      parameters:
        - in: query
          name: q
          schema: { type: string, default: "" }
          description: Search query (matches series title)
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - $ref: "#/components/parameters/SeriesSort"
        - $ref: "#/components/parameters/SeriesOrder"
        - $ref: "#/components/parameters/SeriesReadingStatus"
        - $ref: "#/components/parameters/SeriesGenre"
        - $ref: "#/components/parameters/SeriesLanguage"
        - $ref: "#/components/parameters/SeriesUpstreamStatus"
      responses:
        "200":
          description: Paginated search results, in the requested order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedSeriesResponse" }
        "400": { description: Invalid sort, order, readingStatus or upstreamStatus value }

  /library/series:
    get:
      tags: [library]
      summary: List all series in the library
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0, minimum: 0 }
          description: Zero-based; a negative value is treated as 0
        - in: query
          name: size
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
          description: Values outside the range are clamped
        - $ref: "#/components/parameters/SeriesSort"
        - $ref: "#/components/parameters/SeriesOrder"
        - $ref: "#/components/parameters/SeriesReadingStatus"
        - $ref: "#/components/parameters/SeriesGenre"
        - $ref: "#/components/parameters/SeriesLanguage"
        - $ref: "#/components/parameters/SeriesUpstreamStatus"
      responses:
        "200":
          description: Paginated series list, by title unless `sort` says otherwise
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedSeriesResponse" }
        "400": { description: Invalid sort, order, readingStatus or upstreamStatus value }

    post:
      tags: [library]
      summary: Add a series to the library (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddSeriesRequest" }
      responses:
        "201":
          description: Series added; metadata fetch task enqueued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesDto" }
        "400": { description: Invalid request body }
        "403": { description: Forbidden; the user lacks the required permission }
        "409": { description: Series already in library }

  /library/series/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }

    get:
      tags: [library]
      summary: Get a single series
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesDto" }
        "404": { description: Series not found }

    patch:
      tags: [library]
      summary: Update series settings (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSeriesRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesDto" }
        "400": { description: Invalid defaultFormat or upstreamStatus value, or request body }
        "403": { description: Forbidden; the user lacks the required permission }
        "404": { description: Series not found }

    delete:
      tags: [library]
      summary: Remove a series from the library (ADMIN)
      responses:
        "204": { description: Series removed }
        "403": { description: Forbidden; the user lacks the required permission }
        "404": { description: Series not found }

  /library/series/{id}/status:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }

    patch:
      tags: [reading-status]
      summary: Set reading status for a series (current user)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetReadingStatusRequest" }
      responses:
        "204": { description: Status set }
        "400": { description: Invalid status value or request body }
        "401": { description: Not authenticated }

    delete:
      tags: [reading-status]
      summary: Clear reading status for a series (current user)
      responses:
        "204": { description: Status cleared }
        "401": { description: Not authenticated }

  /library/series/{id}/chapters:
    get:
      tags: [library]
      summary: List chapters for a series (paginated), optionally filtered by download status
      description: Ordered by chapter index, ties broken by id, so pages never repeat or skip a chapter.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [AVAILABLE, PENDING, DOWNLOADING, DOWNLOADED, FAILED]
          description: Filter chapters by download status
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedChapterResponse" }
        "400": { description: Invalid status value }
        "404": { description: Series not found }

  /library/series/{id}/download:
    post:
      tags: [library]
      summary: Enqueue download tasks for all pending/failed chapters in a series (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202":
          description: Tasks enqueued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadQueuedResponse" }
        "403": { description: Forbidden; the user lacks the required permission }
        "404": { description: Series not found }

  /library/series/{id}/refresh:
    post:
      tags: [library]
      summary: Re-enqueue a metadata fetch task for a series (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202": { description: Metadata fetch task enqueued }
        "403": { description: Forbidden; the user lacks the required permission }
        "404": { description: Series not found }

  /library/series/{id}/progress:
    get:
      tags: [library]
      summary: Get read progress for a series (current user)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressDto" }

  /library/chapters/{id}/download:
    post:
      tags: [library]
      summary: Enqueue a download task for a single chapter (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202":
          description: Task enqueued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadQueuedResponse" }
        "403": { description: Forbidden; the user lacks the required permission }
        "404": { description: Chapter not found }

  /library/chapters/{id}:
    delete:
      tags: [library]
      summary: Evict a chapter's downloaded files and reset status to AVAILABLE (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Chapter deleted }
        "403": { description: Forbidden; the user lacks the required permission }
        "404": { description: Chapter not found }

  /library/chapters/{id}/redownload:
    post:
      tags: [library]
      summary: Re-enqueue a download task for an already-downloaded chapter (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202":
          description: Task enqueued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadQueuedResponse" }
        "403": { description: Forbidden; the user lacks the required permission }
        "404": { description: Chapter not found }

  /library/chapters/{id}/pages/{index}:
    get:
      tags: [library]
      summary: Serve a single page image from a downloaded chapter
      description: |
        The content type is the real type of the stored image (JPEG, PNG or WebP). Responses carry an `ETag` and
        `Cache-Control: private, max-age=86400, immutable` (private: pages belong to an authenticated user and must
        not be kept by shared caches).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: index
          required: true
          schema: { type: integer, minimum: 0 }
          description: Zero-based page index
      responses:
        "200":
          description: Page image bytes
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "304": { description: Not modified (ETag match) }
        "404": { description: Chapter or page not found (including a negative index) }
        "423": { description: Chapter not yet downloaded }

  /library/chapters/{id}/read:
    post:
      tags: [library]
      summary: Mark a chapter as read (current user)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Marked as read }
    delete:
      tags: [library]
      summary: Mark a chapter as unread (current user)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Marked as unread }

  /notifications:
    get:
      tags: [notifications]
      summary: List all notification targets
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotificationTargetResponse" }
        "401": { description: Not authenticated }

    post:
      tags: [notifications]
      summary: Create a notification target (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateNotificationTargetRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTargetResponse" }
        "400": { description: Invalid request body or unsupported type }
        "401": { description: Not authenticated }
        "403": { description: Forbidden; the user lacks the required permission }

  /notifications/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }

    patch:
      tags: [notifications]
      summary: Update a notification target (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchNotificationTargetRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTargetResponse" }
        "400": { description: Invalid request body }
        "401": { description: Not authenticated }
        "403": { description: Forbidden; the user lacks the required permission }
        "404": { description: Notification target not found }

    delete:
      tags: [notifications]
      summary: Delete a notification target (ADMIN)
      responses:
        "204": { description: Target deleted }
        "401": { description: Not authenticated }
        "403": { description: Forbidden; the user lacks the required permission }
        "404": { description: Notification target not found }

  /notifications/{id}/test:
    post:
      tags: [notifications]
      summary: Send a test notification to a target (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Test notification dispatched successfully }
        "400": { description: Dispatch failed (bad URL, auth error, etc.) }
        "401": { description: Not authenticated }
        "403": { description: Forbidden; the user lacks the required permission }
        "404": { description: Notification target not found }

  /tasks:
    get:
      tags: [tasks]
      summary: List background tasks, newest first
      description: |
        Filters combine with AND. To retry a failed task, start the work again: `POST /library/chapters/{id}/download`
        (one chapter), `POST /library/series/{id}/download` (all available and failed chapters of a series) or
        `POST /library/series/{id}/refresh` (metadata and chapter list).
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - in: query
          name: status
          schema: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED, CANCELLED] }
          description: Case-insensitive; any other value is rejected with 400
        - in: query
          name: type
          schema: { type: string, enum: [DOWNLOAD_CHAPTER, FETCH_SERIES_METADATA, FETCH_CHAPTERS] }
          description: Case-insensitive; any other value is rejected with 400
        - in: query
          name: targetId
          schema: { type: string, format: uuid }
          description: The chapter or series the task works on
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedTaskResponse" }
        "400": { description: Invalid status, type or targetId value }

  /tasks/{id}:
    get:
      tags: [tasks]
      summary: Get a single task
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDto" }
        "404": { description: Task not found }

  /tasks/{id}/cancel:
    post:
      tags: [tasks]
      summary: Cancel a pending task (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Task cancelled }
        "403": { description: Forbidden; the user lacks the required permission }
        "404": { description: Task not found }

  /connectors:
    get:
      tags: [connectors]
      summary: List registered connectors (ADMIN)
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConnectorDto" }
        "403": { description: Forbidden; the user lacks the required permission }

  /connectors/{id}/search:
    get:
      tags: [connectors]
      summary: Search a connector for series (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Connector ID
        - in: query
          name: q
          schema: { type: string, default: "" }
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
          description: A connector can cap the page size lower than this (MangaDex allows at most 100 per request); the `size` in the answer is the one that was used
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedSearchResponse" }
        "403": { description: Forbidden; the user lacks the required permission }
        "404": { description: Connector not found }

  /connectors/{id}/series/{externalId}:
    get:
      tags: [connectors]
      summary: Fetch series metadata from a connector (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: externalId
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesMetadataDto" }
        "403": { description: Forbidden; the user lacks the required permission }
        "404": { description: Connector not found }

  /connectors/{id}/series/{externalId}/chapters:
    get:
      tags: [connectors]
      summary: Fetch chapter list from a connector (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: externalId
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChapterMetadataDto" }
        "403": { description: Forbidden; the user lacks the required permission }
        "404": { description: Connector not found }

  /library/series/{id}/cover:
    get:
      tags: [library]
      summary: Serve the locally-cached cover image for a series (public, no auth)
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Cover image bytes
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "404": { description: Cover not found (not yet downloaded) }

  /opds/v1:
    servers:
      - url: http://localhost:8080
    get:
      tags: [opds]
      summary: OPDS v1 navigation feed
      security:
        - basicAuth: []
      responses:
        "200":
          description: Atom XML navigation feed
          content:
            application/atom+xml:
              schema: { type: string }

  /opds/v1/catalog:
    servers:
      - url: http://localhost:8080
    get:
      tags: [opds]
      summary: OPDS v1 acquisition catalog (paginated series list)
      security:
        - basicAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0, minimum: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - in: query
          name: genre
          schema: { type: string }
        - in: query
          name: language
          schema: { type: string }
        - in: query
          name: upstreamStatus
          schema: { type: string }
        - in: query
          name: sort
          schema: { type: string, enum: [title, added], default: title }
          description: |
            `title` A-Z, `added` newest first. The feed offers both as OPDS 1.2 facets (`rel="http://opds-spec.org/facet"`,
            `opds:facetGroup="Sort"`, exactly one `opds:activeFacet`); facet and paging links keep the active filters.
      responses:
        "200":
          description: Atom XML acquisition feed
          content:
            application/atom+xml:
              schema: { type: string }
        "400": { description: Invalid sort value }

  /opds/v1/search.xml:
    servers:
      - url: http://localhost:8080
    get:
      tags: [opds]
      summary: OpenSearch 1.1 description document (OPDS 1.2 section 3)
      description: |
        Every OPDS feed links here with `rel="search"` and type `application/opensearchdescription+xml`. The one `Url`
        element has type `application/atom+xml;profile=opds-catalog;kind=acquisition` and the absolute template
        `<base>/opds/v1/search?q={searchTerms}`, where `<base>` is `server.publicUrl` or, when that is unset, the scheme
        and host of this request.
      security:
        - basicAuth: []
      responses:
        "200":
          description: OpenSearch description document
          content:
            application/opensearchdescription+xml:
              schema: { type: string }

  /opds/v1/search:
    servers:
      - url: http://localhost:8080
    get:
      tags: [opds]
      summary: OPDS v1 search results (series whose title contains the search terms)
      security:
        - basicAuth: []
      parameters:
        - in: query
          name: q
          required: true
          description: Search terms; matched against series titles like `GET /library/series/search`
          schema: { type: string, minLength: 1 }
        - in: query
          name: page
          schema: { type: integer, default: 0, minimum: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Atom XML acquisition feed; `next` and `previous` links keep `q`
          content:
            application/atom+xml:
              schema: { type: string }
        "400": { description: "`q` is missing or blank" }

  /opds/v1/history:
    servers:
      - url: http://localhost:8080
    get:
      tags: [opds]
      summary: OPDS v1 reading history of the authenticated user
      security:
        - basicAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0, minimum: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Atom XML acquisition feed
          content:
            application/atom+xml:
              schema: { type: string }

  /opds/v1/library-updates:
    servers:
      - url: http://localhost:8080
    get:
      tags: [opds]
      summary: OPDS v1 recently added chapters
      security:
        - basicAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0, minimum: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Atom XML acquisition feed
          content:
            application/atom+xml:
              schema: { type: string }

  /opds/v1/library/genres:
    servers:
      - url: http://localhost:8080
    get:
      tags: [opds]
      summary: OPDS v1 navigation feed of genres
      security:
        - basicAuth: []
      responses:
        "200":
          description: Atom XML navigation feed
          content:
            application/atom+xml:
              schema: { type: string }

  /opds/v1/library/languages:
    servers:
      - url: http://localhost:8080
    get:
      tags: [opds]
      summary: OPDS v1 navigation feed of languages
      security:
        - basicAuth: []
      responses:
        "200":
          description: Atom XML navigation feed
          content:
            application/atom+xml:
              schema: { type: string }

  /opds/v1/library/status:
    servers:
      - url: http://localhost:8080
    get:
      tags: [opds]
      summary: OPDS v1 navigation feed of publication statuses
      security:
        - basicAuth: []
      responses:
        "200":
          description: Atom XML navigation feed
          content:
            application/atom+xml:
              schema: { type: string }

  /opds/v1/series/{id}:
    servers:
      - url: http://localhost:8080
    get:
      tags: [opds]
      summary: OPDS v1 series feed (chapter list with download and PSE links)
      description: |
        Returns an Atom XML feed listing chapters for the series. Downloaded chapters include:
        - An acquisition link (`rel=http://opds-spec.org/acquisition`) for CBZ download.
        - A PSE streaming link (`rel=http://vaemendis.net/opds-pse/ns`) with `pse:count` set to the chapter's page count. OPDS clients that support the Page Streaming Extension can use this to stream individual pages instead of downloading the full CBZ.
      security:
        - basicAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Atom XML series feed
          content:
            application/atom+xml:
              schema: { type: string }
        "404": { description: Series not found }

  /opds/v1/download/{chapterId}:
    servers:
      - url: http://localhost:8080
    get:
      tags: [opds]
      summary: Download a chapter as CBZ (Basic Auth)
      security:
        - basicAuth: []
      parameters:
        - in: path
          name: chapterId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Chapter CBZ file
          content:
            application/x-cbz:
              schema: { type: string, format: binary }
        "404": { description: Chapter not found or not downloaded }

  /opds/v1/chapters/{id}/pages/{pageNumber}:
    servers:
      - url: http://localhost:8080
    get:
      tags: [opds]
      summary: Stream a single page from a downloaded chapter (OPDS PSE, Basic Auth)
      description: |
        Part of the OPDS Page Streaming Extension (PSE). The chapter's series feed entry
        contains a PSE link with `href` template `/opds/v1/chapters/{id}/pages/{pageNumber}`
        and `pse:count` equal to the chapter's page count. Page numbers are zero-based.

        Responses include:
        - `ETag`: stable hash of chapter ID, page number, and chapter `updatedAt`; changes on re-download.
        - `Cache-Control: private, max-age=31536000, immutable`: pages do not change after download; `private` keeps shared caches from storing them.
        - `304 Not Modified`: returned when `If-None-Match` matches the current ETag.
      security:
        - basicAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
          description: Chapter ID
        - in: path
          name: pageNumber
          required: true
          schema: { type: integer, minimum: 0 }
          description: Zero-based page index
      responses:
        "200":
          description: Page image bytes
          headers:
            ETag:          { schema: { type: string }, description: "Stable page hash, quoted (e.g. \"abc123\")" }
            Cache-Control: { schema: { type: string }, description: "private, max-age=31536000, immutable" }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "304": { description: Not modified (ETag match) }
        "400": { description: Invalid chapter ID or non-integer page number }
        "401": { description: Not authenticated }
        "404": { description: Chapter not found, not downloaded, or page index out of range (including a negative one) }

  /backup/export:
    get:
      tags: [system]
      summary: Export a backup of all user reading data
      description: |
        Exports the current user's reading progress and reading statuses. Series are identified by connector and
        external id, so a backup can be imported into another ChapterVault that has the same series. Library files,
        series metadata, other users and server settings are not part of it. Series with no connector identity are excluded.
        The same external id in two languages is two series; every entry carries its `language`.
      responses:
        "200":
          description: Backup JSON
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:        { type: integer, example: 1 }
                  exportedAt:     { type: string, format: date-time }
                  progress:       { type: array, items: { $ref: "#/components/schemas/BackupProgress" } }
                  readingStatuses: { type: array, items: { $ref: "#/components/schemas/BackupReadingStatus" } }
        "401": { description: Not authenticated }

  /backup/import:
    post:
      tags: [system]
      summary: Import a backup of user reading data
      description: |
        Restores reading progress and reading statuses for the current user. Entries for series that are not in the
        library, with a status the server does not know, or with a negative page are skipped and counted in the summary.
        A series is matched by connector, external id and language; `language` defaults to `en` when absent, so backups
        made before it existed still import.
        The body may be at most 10 MB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exportedAt, progress, readingStatuses]
              properties:
                version:         { type: integer, example: 1 }
                exportedAt:      { type: string }
                progress:        { type: array, items: { $ref: "#/components/schemas/BackupProgress" } }
                readingStatuses: { type: array, items: { $ref: "#/components/schemas/BackupReadingStatus" } }
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  progressRestored:  { type: integer }
                  progressSkipped:   { type: integer }
                  statusesRestored:  { type: integer }
                  statusesSkipped:   { type: integer }
        "400": { description: Invalid backup payload }
        "401": { description: Not authenticated }

  /extensions:
    get:
      tags: [system]
      summary: List loaded extensions (ADMIN)
      description: Extension JARs run inside the server with the same privileges as the server itself and are not verified. Only install extensions you trust.
      responses:
        "200":
          description: List of loaded extensions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExtensionDto" }
        "401": { description: Not authenticated }
        "403": { description: Forbidden; the user lacks the required permission }

  /extensions/{id}:
    get:
      tags: [system]
      summary: Get details for a single extension (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Extension details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtensionDto" }
        "401": { description: Not authenticated }
        "403": { description: Forbidden; the user lacks the required permission }
        "404": { description: Extension not found }

  /extensions/{id}/enable:
    post:
      tags: [system]
      summary: Enable an extension (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204": { description: Extension enabled }
        "401": { description: Not authenticated }
        "403": { description: Forbidden; the user lacks the required permission }
        "404": { description: Extension not found }

  /extensions/{id}/disable:
    post:
      tags: [system]
      summary: Disable an extension (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204": { description: Extension disabled }
        "401": { description: Not authenticated }
        "403": { description: Forbidden; the user lacks the required permission }
        "404": { description: Extension not found }

  /extensions/{id}/reload:
    post:
      tags: [system]
      summary: Reload an extension from disk (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204": { description: Extension reloaded }
        "401": { description: Not authenticated }
        "403": { description: Forbidden; the user lacks the required permission }
        "404": { description: Extension not found }

  /extensions/{id}/unload:
    post:
      tags: [system]
      summary: Unload an extension (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204": { description: Extension unloaded }
        "401": { description: Not authenticated }
        "403": { description: Forbidden; the user lacks the required permission }
        "404": { description: Extension not found }

  /system/updates:
    get:
      tags: [system]
      summary: Check for available updates (MANAGE_SERVER)
      description: |
        Returns the current version, the latest published release and whether an update is available. The server asks
        GitHub once a day; set `updates.checkEnabled: false` to stop it from contacting GitHub, in which case
        `latestVersion` stays null.
      responses:
        "200":
          description: Update status
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentVersion:  { type: string, example: "1.0.0" }
                  latestVersion:   { type: string, nullable: true, example: "1.1.0" }
                  releaseUrl:      { type: string, nullable: true }
                  updateAvailable: { type: boolean }
        "401": { description: Not authenticated }
        "403": { description: Forbidden; the user lacks the required permission }

  /system/storage:
    get:
      tags: [system]
      summary: Library size and free disk space (MANAGE_SERVER)
      description: |
        The sizes are counted by walking the library and thumbnail folders on every call (fast for CBZ, one file per
        chapter; slower for the FOLDER format). Downloads stop, without retrying, while `freeBytes` is below `minFreeBytes`
        (`storage.minFreeMb`, 0 = no check); the task fails with a message saying how much space is free.
      responses:
        "200":
          description: Storage usage in bytes
          content:
            application/json:
              schema:
                type: object
                properties:
                  libraryBytes:    { type: integer, format: int64 }
                  thumbnailsBytes: { type: integer, format: int64 }
                  freeBytes:       { type: integer, format: int64, description: Free space on the disk that holds the library }
                  totalBytes:      { type: integer, format: int64 }
                  minFreeBytes:    { type: integer, format: int64 }
        "401": { description: Not authenticated }
        "403": { description: Forbidden; the user lacks the required permission }
